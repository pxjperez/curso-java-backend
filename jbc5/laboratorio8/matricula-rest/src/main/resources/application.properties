spring.application.name=apimatricula
server.port=8078
#Configuracion de eureka
eureka.client.service-url.default-zone=http://localhost:8761/eureka
# formato fecha
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Lima
#Data Source Properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/matricula
spring.datasource.username=root
spring.datasource.password=root

#JPA Properties
spring.jpa.database=MYSQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#Server Properties
server.error.include-stacktrace=on-param

##Swagger Properties
#Especifica la ruta de la documentación de la API
springdoc.api-docs.path=/api-docs
#Especifica la ruta de la interfaz de usuario de Swagger
springdoc.swagger-ui.path=/
#Especifica la activacion o desactivacion de la interface de usuario de Swagger
springdoc.swagger-ui.enabled=true
#Ordenar en la posicion de cada metodo
#springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.operationsSorter=alpha
