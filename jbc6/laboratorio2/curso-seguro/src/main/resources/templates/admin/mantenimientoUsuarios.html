<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MANTENIMIENTO USUARIO</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <div class="col-4 mx-auto">
                    <h1>MANTENIMIENTO USUARIO</H1>
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr class="table-dark">
                                <th>USER</th>
                                <th>NOMBRE COMPLETO</th>
                                <th>FOTO</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario: ${listaUsuarios}">
                                <td th:text="${usuario.user}"></td>
                                <td th:text="${usuario.nombreApellido}"></td>
                                <td>
                                    <img th:if="${usuario.foto}" width="50px" height="50px" th:src="@{'data:image/jpeg;base64, '+${usuario.fotoBase64}}" />
                                </td>
                                <td>
                                    <a class="btn btn-warning" th:href="@{'formularioActualizarUsuario?idUsuario='+${usuario.idUsuario}}"><i class="bi bi-arrow-clockwise"></i></a> 
                                    <a class="btn btn-danger" th:href="@{'eliminarUsuario?idUsuario='+${usuario.idUsuario}}"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>                        
                    </table>
                </div>
            </div>
        </div>
        <div class="container-fluid">
            <div class="row">
                <div class="col-4 mx-auto">
                    <h1>REGISTRAR USUARIO</h1>
                    <form class="form-control" action="/admin/registrarUsuario" method="POST" >
                        <fieldset>
                            <table>
                                <tr>
                                    <td>
                                        <label for="user" class="form-label" >User:</label>
                                    </td>
                                    <td>
                                        
                                        <input name="user" class="form-control" type="text" />
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="password" class="form-label" >Password:</label>
                                    </td>
                                    <td>
                                        <input name="password" class="form-control" type="text" />
                                        
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="nombreApellido" class="form-label" >Nombre Apellido:</label>
                                    </td>
                                    <td>
                                        <input  name="nombreApellido" class="form-control" type="text" />
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2" class="text-center">
                                        <input type="submit" value="GRABAR" class="btn btn-dark" />
                                    </td> 
                                </tr>
                            </table>
                        </fieldset>   
                    </form>
                </div>
            </div>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
